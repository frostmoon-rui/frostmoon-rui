name: Update public profile card

on:
  workflow_dispatch:
  schedule:
    - cron: '17 20 * * *'
  push:
    branches: [main]
    paths:
      - 'tools/update_profile.py'
      - '.github/workflows/profile-stats.yml'

permissions:
  contents: write

concurrency:
  group: profile-card
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Generate public statistics
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python tools/update_profile.py
      - name: Commit changed card
        shell: bash
        run: |
          if ! git diff --quiet -- assets/activity.svg; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -- assets/activity.svg
            git commit -m 'Update public profile statistics'
            git push
          fi
